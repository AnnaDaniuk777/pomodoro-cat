appId: com.annadaniuk.catodoro
productName: Catodoro
copyright: Copyright (c) 2026 Anna Daniuk and lobotomy-online

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - dist-electron/**
  - build/app-icon.png
  - package.json

win:
  icon: build/app-icon.png
  artifactName: Catodoro-${version}-windows-${arch}.${ext}
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Catodoro

portable:
  artifactName: Catodoro-${version}-windows-portable.${ext}

mac:
  icon: build/app-icon.png
  category: public.app-category.productivity
  artifactName: Catodoro-${version}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

dmg:
  title: Catodoro ${version}

publish:
  provider: github
  releaseType: release
